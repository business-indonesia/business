name: Build Android WebView APK and AAB

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Website URL to wrap in WebView'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'Generated App'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      app_icon_base64:
        description: 'App Icon Base64 (PNG)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-template/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Configure Project Parameters
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'Generated App' }}"
          TARGET_URL="${{ github.event.inputs.target_url || 'https://example.com' }}"
          PKG_NAME="${{ github.event.inputs.package_name || 'com.example.app' }}"
          VER_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          VER_CODE="${{ github.event.inputs.version_code || '1' }}"

          echo "Configuring for: $APP_NAME ($PKG_NAME) -> $TARGET_URL"
          cd android-template

          # Update app/build.gradle
          sed -i "s/{{PACKAGE_NAME}}/$PKG_NAME/g" app/build.gradle
          sed -i "s/{{VERSION_CODE}}/$VER_CODE/g" app/build.gradle
          sed -i "s/{{VERSION_NAME}}/$VER_NAME/g" app/build.gradle

          # Update AndroidManifest.xml (if placeholder exists)
          sed -i "s/{{PACKAGE_NAME}}/$PKG_NAME/g" app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Update strings.xml (safely escape XML)
          SAFE_APP_NAME=$(echo "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          SAFE_TARGET_URL=$(echo "$TARGET_URL" | sed 's/&/\&amp;/g')
          sed -i "s|{{APP_NAME}}|$SAFE_APP_NAME|g" app/src/main/res/values/strings.xml
          sed -i "s|{{TARGET_URL}}|$SAFE_TARGET_URL|g" app/src/main/res/values/strings.xml

          # Update & relocate MainActivity.java
          sed -i "s/{{PACKAGE_NAME}}/$PKG_NAME/g" app/src/main/java/com/template/app/MainActivity.java
          PKG_PATH=$(echo $PKG_NAME | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mv app/src/main/java/com/template/app/MainActivity.java "app/src/main/java/$PKG_PATH/MainActivity.java"

          # Inject Custom App Icon if provided
          APP_ICON_B64="${{ github.event.inputs.app_icon_base64 }}"
          if [ -n "$APP_ICON_B64" ]; then
            echo "Decoding and synchronizing custom app icon..."
            python3 -c "
import sys, base64
raw = sys.argv[1].strip()
if raw:
    try:
        data = base64.b64decode(raw)
        if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) > 50:
            with open('/tmp/custom_icon.png', 'wb') as f:
                f.write(data)
            print('VALID_PNG')
        else:
            print('NOT_PNG')
    except Exception as e:
        print('DECODE_ERR:', e)
" "$APP_ICON_B64"
            if [ -f /tmp/custom_icon.png ]; then
              for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
                cp /tmp/custom_icon.png "app/src/main/res/$dir/ic_launcher.png"
                cp /tmp/custom_icon.png "app/src/main/res/$dir/ic_launcher_round.png"
              done
              echo "✓ Custom App Icon successfully applied to all densities!"
            else
              echo "Warning: Icon data invalid or empty; retaining default launcher icon."
            fi
          else
            echo "No custom icon provided; retaining default icon."
          fi

      - name: Cache Release Keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android-template/app/release.keystore
          key: android-release-keystore-master-v1

      - name: Setup Release Keystore
        run: |
          cd android-template/app
          if [ -f release.keystore ]; then
            echo "✓ Using cached release keystore (consistent certificate signature)."
          else
            echo "Generating persistent release keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android_release_pass \
              -keypass android_release_pass \
              -dname "CN=GeneratedApp, OU=Mobile, O=Business, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android-template/gradlew

      - name: Build Release APK and AAB
        run: |
          cd android-template
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleRelease bundleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          fi

      - name: Prepare Release Artifacts
        id: prepare_files
        run: |
          APP_NAME="${{ github.event.inputs.app_name || 'Generated-App' }}"
          CLEAN_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-' | tr ' ' '-')
          [ -z "$CLEAN_NAME" ] && CLEAN_NAME="Generated-App"

          mkdir -p output_binaries
          cp android-template/app/build/outputs/apk/release/app-release.apk "output_binaries/${CLEAN_NAME}.apk"
          cp android-template/app/build/outputs/bundle/release/app-release.aab "output_binaries/${CLEAN_NAME}.aab"
          echo "clean_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ steps.prepare_files.outputs.clean_name }}
          path: output_binaries/*

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
          draft: false
          prerelease: false
          files: output_binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
