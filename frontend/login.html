<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Generated App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h1>Generated App</h1>
        <p class="card-subtitle">Convert your website URL into native Android APK & AAB</p>
      </div>

      <div class="card">
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
            Login
          </button>
        </form>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const res = await API.post('/api/auth/login', { email, password });
        showToast('Login successful!', 'success');
        setTimeout(() => {
          if (res.user && res.user.role === 'admin') {
            window.location.href = '/dashboard';
          } else {
            window.location.href = '/dashboard';
          }
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
