<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Generated App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-wrapper">
      <a href="/dashboard" class="brand">
        Generated App
        <span class="brand-badge">WebView</span>
      </a>
      <nav class="nav-links">
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/generate">+ Generate App</a>
        <a href="/admin" id="adminNavLink" style="display: none;">Admin</a>
        <a href="#" onclick="handleLogout(); return false;">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
    <!-- Greeting & Action Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 1.6rem; font-weight: 700;">Hello, <span id="userName">User</span></h1>
        <p class="card-subtitle">Manage your generated Android WebView applications</p>
      </div>
      <a href="/generate" class="btn btn-primary">
        + Generate New App
      </a>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Your Apps</div>
        <div class="stat-value" id="statApps">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Successful Builds</div>
        <div class="stat-value" id="statSuccess">0</div>
      </div>
    </div>

    <!-- Apps List Section -->
    <div style="margin-top: 2rem;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem;">Your Applications</h2>
      
      <div id="appsList">
        <div class="card" style="text-align: center; color: var(--text-muted); padding: 3rem 1rem;">
          Loading applications...
        </div>
      </div>
    </div>
  </main>

  <!-- Modal for Build Log Details -->
  <div id="logModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; margin: 0;">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 class="card-title" id="logModalTitle">Build Diagnostics</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeLogModal()">Close</button>
      </div>
      <pre id="logContent" style="background: #0F172A; color: #F8FAFC; padding: 1rem; border-radius: 8px; font-size: 0.8rem; overflow: auto; flex: 1; white-space: pre-wrap; font-family: monospace;"></pre>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let pollInterval = null;

    async function loadDashboard() {
      const user = await checkAuth();
      if (!user) return;

      document.getElementById('userName').textContent = user.name;
      if (user.role === 'admin') {
        document.getElementById('adminNavLink').style.display = 'inline-block';
      }

      try {
        const data = await API.get('/api/apps');
        document.getElementById('statApps').textContent = data.stats.your_apps || 0;
        document.getElementById('statSuccess').textContent = data.stats.successful_builds || 0;

        renderApps(data.apps || []);

        // If any app is building or queued, poll every 3 seconds
        const hasActiveBuild = data.apps.some(a => a.status === 'Building' || a.status === 'Queued');
        if (hasActiveBuild && !pollInterval) {
          pollInterval = setInterval(loadDashboard, 3000);
        } else if (!hasActiveBuild && pollInterval) {
          clearInterval(pollInterval);
          pollInterval = null;
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderApps(apps) {
      const container = document.getElementById('appsList');
      if (apps.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem 1.5rem;">
            <p style="font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem;">No apps generated yet</p>
            <p class="card-subtitle" style="margin-bottom: 1.5rem;">Create your first Android native WebView app in under a minute.</p>
            <a href="/generate" class="btn btn-primary">+ Generate New App</a>
          </div>
        `;
        return;
      }

      container.innerHTML = apps.map(app => {
        let badgeClass = 'badge-secondary';
        if (app.status === 'Success') badgeClass = 'badge-success';
        if (app.status === 'Building' || app.status === 'Queued') badgeClass = 'badge-warning';
        if (app.status === 'Failed') badgeClass = 'badge-danger';

        const canDownload = app.status === 'Success';

        return `
          <div class="app-item">
            <div class="app-item-header">
              <div>
                <h3 class="app-item-title">${escapeHtml(app.name)}</h3>
                <a href="${escapeHtml(app.url)}" target="_blank" rel="noopener noreferrer" class="app-item-url">${escapeHtml(app.url)}</a>
              </div>
              <div>
                <span class="badge ${badgeClass}">${app.status}</span>
              </div>
            </div>

            <div class="app-item-meta">
              <span><strong>Package:</strong> ${escapeHtml(app.package_name)}</span>
              <span><strong>Version:</strong> ${escapeHtml(app.version)} (${app.version_code})</span>
              <span><strong>Created:</strong> ${formatDate(app.created_at)}</span>
            </div>

            <div class="app-item-actions">
              ${canDownload ? `
                <a href="/api/apps/${app.id}/download/apk" class="btn btn-primary btn-sm">
                  Download APK ${app.apk_size ? '(' + formatBytes(app.apk_size) + ')' : ''}
                </a>
                <a href="/api/apps/${app.id}/download/aab" class="btn btn-secondary btn-sm">
                  Download AAB ${app.aab_size ? '(' + formatBytes(app.aab_size) + ')' : ''}
                </a>
              ` : ''}

              ${(app.status === 'Building' || app.status === 'Queued') ? `
                <span style="font-size: 0.85rem; color: var(--warning); display: flex; align-items: center; gap: 0.4rem;">
                  Building Android project... Please wait.
                </span>
              ` : ''}

              ${app.build_log ? `
                <button class="btn btn-secondary btn-sm" onclick="viewLog('${app.id}')">View Log</button>
              ` : ''}

              <button class="btn btn-danger btn-sm" style="margin-left: auto;" onclick="deleteApp('${app.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function viewLog(appId) {
      try {
        const res = await API.get(`/api/apps/${appId}`);
        if (res.app) {
          document.getElementById('logModalTitle').textContent = `Build Log: ${res.app.name}`;
          document.getElementById('logContent').textContent = res.app.build_log || 'No build log available.';
          const modal = document.getElementById('logModal');
          modal.style.display = 'flex';
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function closeLogModal() {
      document.getElementById('logModal').style.display = 'none';
    }

    async function deleteApp(appId) {
      if (!confirm('Are you sure you want to delete this app and its generated artifacts?')) return;
      try {
        await API.delete(`/api/apps/${appId}`);
        showToast('App deleted successfully', 'success');
        loadDashboard();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
