<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Generated App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h1>Generated App</h1>
        <p class="card-subtitle">Create your account to start generating Android apps</p>
      </div>

      <div class="card">
        <form id="registerForm">
          <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" name="name" required placeholder="John Doe" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Repeat your password" autocomplete="new-password">
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
            Register
          </button>
        </form>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="/login">Login</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirmPassword').value;

      if (password !== confirm_password) {
        showToast('Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        await API.post('/api/auth/register', {
          name,
          email,
          password,
          confirm_password
        });
        showToast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
